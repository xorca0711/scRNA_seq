   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(70.969641 166.003161)">Vehicle / transient / sustained</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(83.334094 180.334958)">Time-matched sampling</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(73.15425 195.184958)">Measured cytokine exposure</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="442.6272" y="130.574332" transform="rotate(-0 442.6272 130.574332)">Recipient context</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(360.936028 165.484958)">Epithelial-only / fibroblast co-culture</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(359.366653 180.334958)">Recipient-specific IL1R1 perturbation</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(367.80345 195.184958)">Independent biological replicates</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="747.4464" y="130.574332" transform="rotate(-0 747.4464 130.574332)">Withdrawal and follow-up</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(679.950619 166.356833)">Remove the external stimulus</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(689.507494 180.334958)">Verify target engagement</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(689.145384 195.184958)">Follow recovery over time</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="446.256" y="299.780092" transform="rotate(-0 446.256 299.780092)">Discriminating measurements</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(336.466547 328.423837)">Epithelial mature-state recovery and viable yield</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(293.523187 343.273838)">Fibroblast response, protein measurements and functional readouts</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(310.026937 358.123838)">Lineage measurements if persistence or fate is the endpoint</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="24.408" y="23.791719" transform="rotate(-0 24.408 23.791719)">D4 | Test recovery after IL-1beta withdrawal</text>
  </g>
  <g id="text_10">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="24.408" y="41.1552" transform="rotate(-0 24.408 41.1552)">PROPOSED EXPERIMENT | design schematic only; no outcome data or expected-response curves</text>
  </g>
  <g id="text_11">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.408 432.413437)">RQ4: does recovery after withdrawal depend on exposure history and fibroblast IL-1 reception?</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.408 445.913438)">Resolve dose, sampling times, genotype controls and replication in a dedicated experimental protocol.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(24.408 459.413438)">The completed cross-sectional RNA analysis cannot establish reversibility, persistent fate or malignant transformation.</text>
  </g>
